<!--
  ============================================================================
  COUNTRYBALL SOCCER 2026
  ----------------------------------------------------------------------------
  Single-file HTML5 game. No build step, no server, no dependencies except the
  p5.js CDN. Drop this file into any GitHub repo and enable GitHub Pages
  (Settings > Pages > Deploy from branch > main / root) and it just works.

  TOURNAMENT FORMAT
    - 48 nations
    - 12 groups of 4 (group stage: player plays 3 matches)
    - Top 2 from each group + 8 best third-placed teams = 32 qualifiers
    - Round of 32 -> Round of 16 -> Quarterfinals -> Semifinals -> Final

  FEATURES
    - Single Player World Cup tournament (Easy / Medium / Hard AI)
    - Local 2-Player (desktop only)
    - Penalty Shootout mode
    - Light mode (default) + Dark mode (Settings > THEME)
    - Retro mode (separate, orthogonal to Light/Dark)
    - FPS counter shows automatically in modern modes
    - Accounts, achievements and save games via localStorage

  NOTES
    - All progress is stored locally in the browser (localStorage keys "CBS_*").
    - Touch controls are available via Settings > MOB (auto-eases the AI).
  ============================================================================
-->

var _flagHelpers = {
    distSeg: function(px, py, ax, ay, bx, by) {
        var dx = bx - ax, dy = by - ay;
        var len2 = dx * dx + dy * dy;
        if (len2 < 1e-9) { return sqrt((px - ax) * (px - ax) + (py - ay) * (py - ay)); }
        var t = ((px - ax) * dx + (py - ay) * dy) / len2;
        if (t < 0) { t = 0; } else if (t > 1) { t = 1; }
        var cx = ax + t * dx, cy = ay + t * dy;
        return sqrt((px - cx) * (px - cx) + (py - cy) * (py - cy));
    },
    star: function(nx, ny, cx, cy, outer, rot, n) {
        var pts = [];
        var inner = outer * 0.42;
        var i, j;
        for (i = 0; i < n * 2; i++) {
            var r = (i % 2 === 0) ? outer : inner;
            var a = rot + i * PI / n;
            pts.push([cx + cos(a) * r, cy + sin(a) * r]);
        }
        var inside = false;
        for (i = 0, j = pts.length - 1; i < pts.length; j = i++) {
            var xi = pts[i][0], yi = pts[i][1];
            var xj = pts[j][0], yj = pts[j][1];
            if (((yi > ny) !== (yj > ny)) && (nx < (xj - xi) * (ny - yi) / (yj - yi) + xi)) {
                inside = !inside;
            }
        }
        return inside;
    },
    unionJack: function(ux, uy) {
        var ax = abs(ux), ay = abs(uy);
        if (ax < 0.17 || ay < 0.17) { return [200, 16, 46]; }
        if (ax < 0.30 || ay < 0.30) { return [255, 255, 255]; }
        if (abs(ax - ay) < 0.12) { return [200, 16, 46]; }
        if (abs(ax - ay) < 0.30) { return [255, 255, 255]; }
        return [1, 33, 105];
    }
};

    var ax, ay, u, v, gx, gy, sx, sy, rr, ang;

        case 0:
            if (abs(nx) + abs(ny) < 0.95) {

                        (abs(nx + 0.02) < 0.03 && abs(ny + 0.05) < 0.03)) { return [255, 255, 255]; }

        case 1:
            if (abs(ny) > 0.34) { return [116, 172, 223]; }
            rr = nx * nx + ny * ny;
            if (rr < 0.05) { return [246, 180, 14]; }
            if (rr < 0.09) {
                ang = atan2(ny, nx);
                if (floor((ang + PI) / (TWO_PI / 12)) % 2 === 0) { return [246, 180, 14]; }
            }
            return [255, 255, 255];
        case 2:
            if (nx < -0.33) { return [0, 35, 149]; }
            if (nx > 0.33) { return [237, 41, 57]; }
            return [255, 255, 255];
        case 3:
            if (ny < -0.33) { return [30, 30, 30]; }
            if (ny > 0.33) { return [255, 206, 0]; }

        case 4:

            }
            return [241, 196, 0];
        case 6:
            if (nx < -0.33) { return [0, 146, 70]; }
            if (nx > 0.33) { return [206, 17, 38]; }
            return [255, 255, 255];
        case 7:

            if (rr < 0.35) { return [188, 0, 45]; }
            return [255, 255, 255];
        case 8:
            if (nx < -0.33) { return [0, 104, 71]; }
            if (nx > 0.33) { return [206, 17, 38]; }
            rr = nx * nx + ny * ny;
            if (rr < 0.09) {

        case 9:
            if (nx < -0.33) { return [22, 155, 98]; }

            return [255, 255, 255];
        case 10:
            if (nx < -0.24 && ny < 0.08) {
                u = (nx + 1) / 0.76; v = (ny + 1) / 1.08;
                gx = floor(u * 5); gy = floor(v * 5);

            }

        case 11:

var soccerPatternRGB = function(nx, ny) {
    var r = sqrt(nx * nx + ny * ny);
    if (r < 0.38) { return [26, 26, 26]; }
    for (var i = 0; i < 5; i++) {
        var a = TWO_PI / 5 * i - HALF_PI;
        var cx = cos(a) * 0.72, cy = sin(a) * 0.72;
        var dx = nx - cx, dy = ny - cy;
        if (dx * dx + dy * dy < 0.11) { return [26, 26, 26]; }
    }
    return [250, 250, 250];

// --- Flag drawing ---
var drawFlagShapes = function(idx, w, h) {
    noStroke();
    var step = 1;
    var py, px, nx, ny, rgb;
    var lastR, lastG, lastB, segStart;
    for (py = 0; py < h; py += step) {
        ny = ((py + step * 0.5) / h) * 2 - 1;
        lastR = -1; lastG = -1; lastB = -1;
        segStart = 0;
        for (px = 0; px <= w; px += step) {
            if (px < w) {
                nx = ((px + step * 0.5) / w) * 2 - 1;
                rgb = getFlagRGB(idx, nx, ny);
            } else { rgb = [-1, -1, -1]; }
            if (rgb[0] !== lastR || rgb[1] !== lastG || rgb[2] !== lastB) {
                if (lastR >= 0) {
                    fill(lastR, lastG, lastB);
                    rect(segStart, py, px - segStart, step);
                }
                lastR = rgb[0]; lastG = rgb[1]; lastB = rgb[2];
                segStart = px;
            }
        }
    }
};

var drawFlag = function(idx, x, y, w, h) {
    push();
    translate(x, y);
    if (retroMode) {
        noStroke();
        fill(teamColors[idx] || color(100));
        rect(0, 0, w, h);

        drawFlagShapes(idx, w, h);

    noFill(); stroke(0, 90); strokeWeight(1);

    pop();

var drawCountryballScanlines = function(idx, radius) {
    var rSq = radius * radius;
    var step = 0.5;
    var bandHeight = 1.3;
    var py, px, xSpan, rgb, r2, g2, b2, qr, qg, qb;
    var lastR, lastG, lastB, segStart;
    var lx = -0.48, ly = -0.62, lz = 0.62;
    for (py = -radius; py <= radius; py += step) {
        xSpan = sqrt(max(0, rSq - py * py));
        lastR = -1; lastG = -1; lastB = -1;
        segStart = -xSpan;
        for (px = -xSpan; px <= xSpan; px += step) {
            rgb = getFlagRGB(idx, px / radius, py / radius);
            var nx = px / radius, ny = py / radius;
            var nzSq = 1 - nx * nx - ny * ny;
            var nz = nzSq > 0 ? sqrt(nzSq) : 0;
            var diff = nx * lx + ny * ly + nz * lz;
            if (diff < 0) { diff = 0; }
            var intensity = (0.55 + 0.72 * diff) * (0.82 + 0.18 * nz);
            var spec = pow(diff, 34) * 1.1;
            r2 = rgb[0] * intensity + 255 * spec;
            g2 = rgb[1] * intensity + 255 * spec;
            b2 = rgb[2] * intensity + 255 * spec;
            if (r2 > 255) { r2 = 255; } else if (r2 < 0) { r2 = 0; }
            if (g2 > 255) { g2 = 255; } else if (g2 < 0) { g2 = 0; }
            if (b2 > 255) { b2 = 255; } else if (b2 < 0) { b2 = 0; }
            qr = (r2 / 12 | 0) * 12;
            qg = (g2 / 12 | 0) * 12;
            qb = (b2 / 12 | 0) * 12;
            if (qr !== lastR || qg !== lastG || qb !== lastB) {
                if (lastR >= 0) {
                    noStroke(); fill(lastR, lastG, lastB);
                    rect(segStart, py, px - segStart, bandHeight);
                }
                lastR = qr; lastG = qg; lastB = qb;
                segStart = px;
            }
        }
        if (lastR >= 0) {
            noStroke(); fill(lastR, lastG, lastB);
            rect(segStart, py, xSpan - segStart, bandHeight);
        }
    }
};

    var hover = (mouseX > x && mouseX < x + w && mouseY > y && mouseY < y + h);
    fill(theme.btnShadow); rect(x + 2, y + 3, w, h, 8);
    var rClr = min(255, red(mainClr) + 30);
    var gClr = min(255, green(mainClr) + 30);
    var bClr = min(255, blue(mainClr) + 30);
    fill(hover ? color(rClr, gClr, bClr) : mainClr);
    stroke(hover ? color(255, 230, 100) : color(255, 200));
    strokeWeight(2); rect(x, y, w, h, 8);
    noStroke(); fill(255, 80); rect(x + 2, y + 2, w - 4, h / 2 - 2, 6);
    fill(255); textAlign(CENTER, CENTER); textSize(11);
    text(label, x + w / 2, y + h / 2);
};

var drawDisabledButton = function(x, y, w, h, label) {
    fill(theme.btnShadow); rect(x + 2, y + 3, w, h, 8);
    fill(theme.disabledBg); stroke(theme.disabledStroke); strokeWeight(2); rect(x, y, w, h, 8);
    fill(theme.disabledText); textAlign(CENTER, CENTER); textSize(11);
    text(label, x + w / 2, y + h / 2);
};

var spawnBurst = function(x, y, c) {
    for (var i = 0; i < 14; i++) {
        particles.push({ x: x, y: y, vx: random(-4, 4), vy: random(-6, 1), life: 255, color: c });
    }
};

var updateAndDrawParticles = function() {
    for (var i = particles.length - 1; i >= 0; i--) {
        var p = particles[i];
        if (!paused) {
            p.x += p.vx; p.y += p.vy; p.vy += 0.12; p.life -= 9;
        }
        fill(red(p.color), green(p.color), blue(p.color), p.life);
        noStroke(); ellipse(p.x, p.y, 5, 5);
        if (p.life <= 0) { particles.splice(i, 1); }
    }
};

var spawnConfetti = function() {
    for (var i = 0; i < 4; i++) {
        var col;
        var r = random(0, 4);
        if (r < 1) { col = color(255, 220, 80); }
        else if (r < 2) { col = color(80, 200, 255); }
        else if (r < 3) { col = color(255, 120, 180); }
        else { col = color(120, 255, 150); }
        confetti.push({
            x: random(-10, canvasWidth + 10), y: -10,
            vx: random(-0.8, 0.8), vy: random(1.2, 3.2),
            color: col, size: random(4, 8),
            rot: random(0, TWO_PI), rotSpeed: random(-0.15, 0.15)
        });
    }
};

var updateAndDrawConfetti = function() {
    for (var i = confetti.length - 1; i >= 0; i--) {
        var c = confetti[i];
        c.x += c.vx; c.y += c.vy; c.vy += 0.05; c.rot += c.rotSpeed;
        push(); translate(c.x, c.y); rotate(c.rot);
        fill(red(c.color), green(c.color), blue(c.color), 230);
        noStroke();
        rect(-c.size / 2, -c.size / 3, c.size, c.size / 1.5);
        pop();
        if (c.y > canvasHeight + 20) { confetti.splice(i, 1); }
    }
};

// ============================================================
// GROUP STAGE LOGIC
// ============================================================
var buildGroups = function() {
    var pool = [];
    var i;
    for (i = 0; i < 48; i++) {
        if (i !== selectedCountry) { pool.push(i); }
    }
    for (var j = pool.length - 1; j > 0; j--) {
        var r = floor(random(0, j + 1));
        var t = pool[j]; pool[j] = pool[r]; pool[r] = t;
    }
    groups = [];
    playerGroupIdx = floor(random(0, 12));
    var poolIdx = 0;
    for (var g = 0; g < 12; g++) {
        var teams = [];
        if (g === playerGroupIdx) {
            teams.push(selectedCountry);
            teams.push(pool[poolIdx++]);
            teams.push(pool[poolIdx++]);
            teams.push(pool[poolIdx++]);
        } else {
            teams.push(pool[poolIdx++]);
            teams.push(pool[poolIdx++]);
            teams.push(pool[poolIdx++]);
            teams.push(pool[poolIdx++]);
        }
        groups.push({
            teams: teams,
            results: [null, null, null, null, null, null],
            standings: null
        });
    }
    playerMatchesPlayed = 0;
    inGroupStage = true;
};

var getPlayerOpponent = function(matchNum) {
    return groups[playerGroupIdx].teams[matchNum + 1];
};

var getPlayerGroupLetter = function() {
    return String.fromCharCode(65 + playerGroupIdx);
};

var simulateResult = function() {
    var sa = floor(random(0, 4));
    var sb = floor(random(0, 4));
    return { sa: sa, sb: sb };
};

var simulateRestOfGroups = function() {
    for (var g = 0; g < 12; g++) {
        for (var m = 0; m < 6; m++) {
            if (groups[g].results[m] === null) {
                groups[g].results[m] = simulateResult();
            }
        }
    }
};

var computeStandings = function(grp) {
    var stats = {};
    var i, m;
    for (i = 0; i < 4; i++) {
        stats[grp.teams[i]] = { p: 0, w: 0, d: 0, l: 0, gf: 0, ga: 0, pts: 0 };
    }
    for (m = 0; m < 6; m++) {
        var res = grp.results[m];
        if (!res) { continue; }
        var pair = GROUP_MATCH_PAIRS[m];
        var ta = grp.teams[pair[0]];
        var tb = grp.teams[pair[1]];
        stats[ta].p++; stats[tb].p++;
        stats[ta].gf += res.sa; stats[ta].ga += res.sb;
        stats[tb].gf += res.sb; stats[tb].ga += res.sa;
        if (res.sa > res.sb) { stats[ta].w++; stats[ta].pts += 3; stats[tb].l++; }
        else if (res.sb > res.sa) { stats[tb].w++; stats[tb].pts += 3; stats[ta].l++; }
        else { stats[ta].d++; stats[tb].d++; stats[ta].pts++; stats[tb].pts++; }
    }
    var arr = grp.teams.map(function(t) {
        var s = stats[t];
        return { team: t, p: s.p, w: s.w, d: s.d, l: s.l,
                 gf: s.gf, ga: s.ga, gd: s.gf - s.ga, pts: s.pts };
    });
    arr.sort(function(a, b) {
        if (b.pts !== a.pts) { return b.pts - a.pts; }
        if (b.gd !== a.gd) { return b.gd - a.gd; }
        if (b.gf !== a.gf) { return b.gf - a.gf; }
        return a.team - b.team;
    });
    return arr;
};

var determineQualifiers = function() {
    var firsts = [], seconds = [], thirds = [];
    for (var g = 0; g < 12; g++) {
        var st = computeStandings(groups[g]);
        groups[g].standings = st;
        firsts.push(st[0]);
        seconds.push(st[1]);
        thirds.push(st[2]);
    }
    thirds.sort(function(a, b) {
        if (b.pts !== a.pts) { return b.pts - a.pts; }
        if (b.gd !== a.gd) { return b.gd - a.gd; }
        if (b.gf !== a.gf) { return b.gf - a.gf; }
        return a.team - b.team;
    });
    var qualified = [];
    var i;
    for (i = 0; i < 12; i++) { qualified.push(firsts[i].team); }
    for (i = 0; i < 12; i++) { qualified.push(seconds[i].team); }
    for (i = 0; i < 8; i++) { qualified.push(thirds[i].team); }
    return qualified;
};

var fillKnockoutBracket = function(qualified) {
    var rest = [];
    for (var i = 0; i < qualified.length; i++) {
        if (qualified[i] !== selectedCountry) { rest.push(qualified[i]); }
    }
    for (var j = rest.length - 1; j > 0; j--) {
        var r = floor(random(0, j + 1));
        var t = rest[j]; rest[j] = rest[r]; rest[r] = t;
    }
    var seeded = [selectedCountry].concat(rest);
    bracket.r0 = [];
    for (var m = 0; m < 16; m++) {
        bracket.r0.push({ t1: seeded[m * 2], t2: seeded[m * 2 + 1], s1: null, s2: null, winner: null });
    }
    bracket.r1 = [];
    for (m = 0; m < 8; m++) { bracket.r1.push({ t1: null, t2: null, s1: null, s2: null, winner: null }); }
    bracket.r2 = [];
    for (m = 0; m < 4; m++) { bracket.r2.push({ t1: null, t2: null, s1: null, s2: null, winner: null }); }
    bracket.r3 = [];
    for (m = 0; m < 2; m++) { bracket.r3.push({ t1: null, t2: null, s1: null, s2: null, winner: null }); }
    bracket.r4 = [{ t1: null, t2: null, s1: null, s2: null, winner: null }];
    tournamentRound = 1;
    setNextAiOpponent();
};

// ============================================================
// KNOCKOUT LOGIC
// ============================================================
var simulateMatch = function(match) {
    if (match.t1 === null || match.t2 === null) { return; }
    var sc1 = floor(random(0, 5));
    var sc2 = floor(random(0, 5));
    if (sc1 === sc2) { sc1++; }
    match.s1 = sc1; match.s2 = sc2;
    match.winner = sc1 > sc2 ? match.t1 : match.t2;
};

var checkMatchAchievements = function() {
    if (score1 - score2 >= 6) {
        achievements.brazilAward = true;
        saveAccountData();
    }
};

var getRoundList = function(round) {
    if (round === 1) { return bracket.r0; }
    if (round === 2) { return bracket.r1; }
    if (round === 3) { return bracket.r2; }
    if (round === 4) { return bracket.r3; }
    return bracket.r4;
};

var simulateCurrentRound = function() {
    var roundList = getRoundList(tournamentRound);
    var i;
    for (i = 0; i < roundList.length; i++) {
        var m = roundList[i];
        if (m.winner === null) {
            if (m.t1 === selectedCountry || m.t2 === selectedCountry) {
                m.s1 = score1; m.s2 = score2;
                m.winner = score1 > score2 ? m.t1 : m.t2;
                checkMatchAchievements();
            } else { simulateMatch(m); }
        }
    }
    if (tournamentRound === 1) {
        for (i = 0; i < 8; i++) {
            bracket.r1[i].t1 = bracket.r0[i * 2].winner;
            bracket.r1[i].t2 = bracket.r0[i * 2 + 1].winner;
        }
    } else if (tournamentRound === 2) {
        for (i = 0; i < 4; i++) {
            bracket.r2[i].t1 = bracket.r1[i * 2].winner;
            bracket.r2[i].t2 = bracket.r1[i * 2 + 1].winner;
        }
    } else if (tournamentRound === 3) {
        for (i = 0; i < 2; i++) {
            bracket.r3[i].t1 = bracket.r2[i * 2].winner;
            bracket.r3[i].t2 = bracket.r2[i * 2 + 1].winner;
        }
    } else if (tournamentRound === 4) {
        bracket.r4[0].t1 = bracket.r3[0].winner;
        bracket.r4[0].t2 = bracket.r3[1].winner;
    }
    if (bracket.r4[0].winner === selectedCountry) {
        achievements.victory = true;
        if (gameMode === "SINGLE") {
            difficultyWins[difficulty] = true;
            if (difficultyWins.EASY && difficultyWins.MEDIUM && difficultyWins.HARD) { achievements.champion = true; }
        }
        saveAccountData();
    }
    if (tournamentRound < 6) { tournamentRound++; }
};

var isPlayerInBracket = function() {
    if (!bracket.r0) { return false; }
    for (var i = 0; i < bracket.r0.length; i++) {
        var m = bracket.r0[i];
        if (m && (m.t1 === selectedCountry || m.t2 === selectedCountry)) { return true; }
    }
    return false;
};

var isPlayerEliminated = function() {
    if (!isPlayerInBracket()) { return true; }
    var allRounds = [bracket.r0, bracket.r1, bracket.r2, bracket.r3, bracket.r4];
    for (var r = 0; r < allRounds.length; r++) {
        for (var m = 0; m < allRounds[r].length; m++) {
            var chk = allRounds[r][m];
            if (chk && chk.winner !== null &&
                (chk.t1 === selectedCountry || chk.t2 === selectedCountry) &&
                chk.winner !== selectedCountry) { return true; }
        }
    }
    return false;
};

var setNextAiOpponent = function() {
    var activeMatchList = getRoundList(tournamentRound);
    if (!activeMatchList) { return; }
    for (var i = 0; i < activeMatchList.length; i++) {
        var m = activeMatchList[i];
        if (m.t1 === selectedCountry && m.t2 !== null) { aiCountry = m.t2; return; }
        if (m.t2 === selectedCountry && m.t1 !== null) { aiCountry = m.t1; return; }
    }
};

// ENTITIES
// ============================================================
var initEntities = function() {
    if (teamColors.length === 0) { initColors(); }
    var isSolo = (gameMode === "SINGLE");
    var isLocal = (gameMode === "LOCAL");
    var aiCfg = getAiConfig();

    var p1Name = isLocal ? tempName1 : username;
    var p1CountryIdx = selectedCountry;
    var p2TeamIdx, p2Name;
    if (isLocal) { p2TeamIdx = p2Country; p2Name = tempName2; }
    else { p2TeamIdx = aiCountry; p2Name = tournamentTeams[aiCountry]; }

    player1 = {
        x: 80, y: 300, vx: 0, vy: 0, radius: 24,
        speed: 5.8, jumpPower: -10.8, teamIndex: p1CountryIdx,
        isGrounded: false, color: teamColors[p1CountryIdx], name: p1Name
    };
    player2 = {
        x: 320, y: 300, vx: 0, vy: 0, radius: 24,
        speed: isSolo ? aiCfg.speed : 5.8,
        jumpPower: isSolo ? aiCfg.jumpPower : -10.8, teamIndex: p2TeamIdx,
        isGrounded: false, color: teamColors[p2TeamIdx], name: p2Name
    };
    ball = { x: 200, y: 150, vx: random(-2, 2), vy: 0, radius: 11, angle: 0, teamIndex: -1 };
};

var setupPenaltyData = function() {
    penBallState = "READY"; penGoalieState = "IDLE"; penBallDir = "NONE";
    penaltyTurn = 1; penaltyIndex = 0;
    p1PenScores = [0, 0, 0, 0, 0]; p2PenScores = [0, 0, 0, 0, 0];
    score1 = 0; score2 = 0;
};

var triggerPenaltyShot = function(dir) {
    if (paused) { return; }
    if (penBallState !== "READY") { return; }
    penBallState = "KICKED"; penTimer = millis();
    if (penaltyTurn === 1) {
        penBallDir = dir;
        var diveWrong = (random(1) < getPenaltyDiveWrongChance());
        penGoalieState = diveWrong ? (dir === "LEFT" ? "RIGHT" : "LEFT") : dir;
    } else {
        penGoalieState = dir;
        penBallDir = (random(1) < 0.5) ? "LEFT" : "RIGHT";
    }
};

// --- Joystick ---
var drawJoystick = function() {
    noStroke();
    fill(0, 120, 200, 80);
    ellipse(joystick.baseX, joystick.baseY, joystick.baseRadius * 2, joystick.baseRadius * 2);
    stroke(255, 180); strokeWeight(2); noFill();
    ellipse(joystick.baseX, joystick.baseY, joystick.baseRadius * 2, joystick.baseRadius * 2);
    ellipse(joystick.baseX, joystick.baseY, joystick.baseRadius * 1.15, joystick.baseRadius * 1.15);
    noStroke(); fill(255, 200);
    textAlign(CENTER, CENTER); textSize(9);
    text("JUMP", joystick.baseX, joystick.baseY - joystick.baseRadius + 8);
    text("L", joystick.baseX - joystick.baseRadius + 10, joystick.baseY);
    text("R", joystick.baseX + joystick.baseRadius - 10, joystick.baseY);
    fill(joystick.active ? color(120, 180, 240) : color(60, 90, 140));
    stroke(255); strokeWeight(2);
    ellipse(joystick.knobX, joystick.knobY, joystick.knobRadius * 2, joystick.knobRadius * 2);
    noStroke(); fill(255, 100);
    ellipse(joystick.knobX - 4, joystick.knobY - 4, joystick.knobRadius * 0.8, joystick.knobRadius * 0.6);
};

var drawMobileControls = function() {
    if (!mobileControlsEnabled) { return; }
    drawJoystick();
};

var updateJoystick = function(mx, my) {
    if (!joystick.active) { return; }
    var dx = mx - joystick.baseX, dy = my - joystick.baseY;
    var dist = sqrt(dx * dx + dy * dy);
    if (dist > joystick.baseRadius) {
        dx = dx / dist * joystick.baseRadius;
        dy = dy / dist * joystick.baseRadius;
    }
    joystick.knobX = joystick.baseX + dx;
    joystick.knobY = joystick.baseY + dy;
    var deadzone = 9;
    mobileBtn.left = dx < -deadzone;
    mobileBtn.right = dx > deadzone;
    mobileBtn.jump = dy < -deadzone * 1.6;
};

var handleJoystickPress = function(mx, my) {
    if (mx > canvasWidth * 0.72) { return false; }
    if (my < 260) { return false; }
    joystick.baseX = mx; joystick.baseY = my;
    joystick.knobX = mx; joystick.knobY = my;
    joystick.active = true;
    mobileBtn.left = false; mobileBtn.right = false; mobileBtn.jump = false;
    return true;
};

var releaseJoystick = function() {
    joystick.active = false;
    joystick.knobX = joystick.baseX; joystick.knobY = joystick.baseY;
    mobileBtn.left = false; mobileBtn.right = false; mobileBtn.jump = false;
};

// ============================================================
// MATCH END
// ============================================================
var goToMatchEnd = function(isPenalties) {
    matchIsPenalties = isPenalties;
    var p1Won = (score1 > score2);
    var isSolo = (gameMode === "SINGLE");
    var isLocal = (gameMode === "LOCAL");
    matchIsDraw = false;

    if (isSolo) {
        if (inGroupStage) {
            var mi = PLAYER_MATCH_INDICES[playerMatchesPlayed];
            groups[playerGroupIdx].results[mi] = { sa: score1, sb: score2 };
            matchIsWin = p1Won;
            matchIsDraw = (score1 === score2);
            if (matchIsWin) { matchWinnerName = username; matchWinnerCountry = selectedCountry; }
            else if (matchIsDraw) { matchWinnerName = "Draw"; matchWinnerCountry = selectedCountry; }
            else { matchWinnerName = tournamentTeams[aiCountry]; matchWinnerCountry = aiCountry; }
        } else {
            simulateCurrentRound();
            matchIsWin = p1Won;
            if (matchIsWin) { matchWinnerName = username; matchWinnerCountry = selectedCountry; }
            else { matchWinnerName = tournamentTeams[aiCountry]; matchWinnerCountry = aiCountry; }
        }
    } else if (isLocal) {
        matchIsWin = true;
        if (p1Won) { matchWinnerName = tempName1; matchWinnerCountry = selectedCountry; }
        else { matchWinnerName = tempName2; matchWinnerCountry = p2Country; }
    } else {
        matchIsWin = p1Won;
        matchWinnerName = matchIsWin ? username : "AI";
        matchWinnerCountry = matchIsWin ? selectedCountry : aiCountry;
    }

    matchScoreLine = score1 + " - " + score2;
    if (isPenalties) { matchScoreLine += "  penalties"; }

    confetti = []; particles = []; keys = {}; paused = false;
    releaseJoystick();
    gameState = "MATCH_END";
};

var continueAfterMatch = function() {
    confetti = [];
    if (gameMode === "SINGLE") {
        if (inGroupStage) {
            playerMatchesPlayed++;
            if (playerMatchesPlayed >= 3) {
                // Group complete — simulate the rest and compute standings
                simulateRestOfGroups();
                for (var g = 0; g < 12; g++) {
                    groups[g].standings = computeStandings(groups[g]);
                }
            }
            gameState = "GROUPS";
        } else {
            gameState = "BRACKET";
        }
    } else {
        gameState = "TITLE";
    }
};

var evaluatePenaltyFrameResult = function() {
    var goalScored = (penBallDir !== penGoalieState);
    if (penaltyTurn === 1) {
        if (penaltyIndex < 5) { p1PenScores[penaltyIndex] = goalScored ? 1 : -1; }
        if (goalScored) { score1++; }
        penaltyTurn = 2;
    } else {
        if (penaltyIndex < 5) { p2PenScores[penaltyIndex] = goalScored ? 1 : -1; }
        if (goalScored) { score2++; }
        penaltyIndex++; penaltyTurn = 1;
    }
    spawnBurst(200, 160, goalScored ? color(0, 255, 100) : color(255, 50, 50));
    penBallState = "READY"; penGoalieState = "IDLE"; penBallDir = "NONE";
    if (penaltyIndex >= 5 && penaltyTurn === 1 && score1 !== score2) { goToMatchEnd(true); }
};

// ============================================================
// PHYSICS
// ============================================================
var updatePlayer = function(p, controlType) {
    var moveLeft = false, moveRight = false, jump = false;
    var isLocal = (gameMode === "LOCAL");

    if (controlType === "P1_INPUT") {
        var p1WASD = isLocal || (p1ControlMode === "WASD");
        if (p1WASD) {
            moveLeft = keys[65] || mobileBtn.left;
            moveRight = keys[68] || mobileBtn.right;
            jump = keys[87] || mobileBtn.jump;
        } else {
            moveLeft = keys[37] || mobileBtn.left;
            moveRight = keys[39] || mobileBtn.right;
            jump = keys[38] || mobileBtn.jump;
        }
    } else if (controlType === "P2_INPUT") {
        if (isLocal) { moveLeft = keys[37]; moveRight = keys[39]; jump = keys[38]; }
        else if (p1ControlMode === "ARROWS") { moveLeft = keys[65]; moveRight = keys[68]; jump = keys[87]; }
        else { moveLeft = keys[37]; moveRight = keys[39]; jump = keys[38]; }
    } else if (controlType === "AI") {
        var aiCfg = getAiConfig();
        var targetX = ball.x + ball.vx * aiCfg.lead;
        if (aiCfg.error > 0) { targetX += random(-aiCfg.error, aiCfg.error); }

        if (ball.x > aiCfg.chaseX) {
            if (targetX < p.x - 15) { moveLeft = true; }
            else if (targetX > p.x + 15) { moveRight = true; }
            if (ball.y < p.y - 25 && abs(ball.x - p.x) < aiCfg.jumpRange &&
                p.isGrounded && random(1) < aiCfg.jumpChance) { jump = true; }
        } else {
            if (p.x < aiCfg.defendPos) { moveRight = true; }
            else if (p.x > aiCfg.defendPos + 20) { moveLeft = true; }
        }
    }

    if (moveLeft) { p.vx = -p.speed; }
    else if (moveRight) { p.vx = p.speed; }
    else { p.vx = 0; }

    if (jump && p.isGrounded) { p.vy = p.jumpPower; p.isGrounded = false; }
    p.x += p.vx; p.vy += gravity; p.y += p.vy;
    if (p.y >= 350 - p.radius) { p.y = 350 - p.radius; p.vy = 0; p.isGrounded = true; }
    p.x = constrain(p.x, p.radius, canvasWidth - p.radius);
};

var updateBall = function() {
    ball.vy += gravity * 0.65; ball.x += ball.vx; ball.y += ball.vy;
    ball.vx *= friction; ball.vy *= friction; ball.angle += ball.vx * 0.1;
    if (ball.y >= 350 - ball.radius) { ball.y = 350 - ball.radius; ball.vy = -ball.vy * 0.72; }
    if (ball.y <= ball.radius) { ball.y = ball.radius; ball.vy = -ball.vy * 0.72; }
    if (ball.y < 350 - goalHeight) {
        if (ball.x <= ball.radius) { ball.x = ball.radius; ball.vx = -ball.vx * 0.75; }
        if (ball.x >= canvasWidth - ball.radius) { ball.x = canvasWidth - ball.radius; ball.vx = -ball.vx * 0.75; }
    }
};

var resolveCollision = function(p) {
    var dx = ball.x - p.x, dy = ball.y - p.y;
    var distance = sqrt(dx * dx + dy * dy);
    var minDist = p.radius + ball.radius;
    if (distance < minDist) {
        var angle = atan2(dy, dx);
        ball.x = p.x + cos(angle) * minDist;
        ball.y = p.y + sin(angle) * minDist;
        ball.vx = cos(angle) * 8.5 + p.vx * 0.45;
        ball.vy = sin(angle) * 8.5 + p.vy * 0.45;
        if (ball.teamIndex !== p.teamIndex) {
            ball.teamIndex = p.teamIndex;
            spawnBurst(ball.x, ball.y, teamColors[p.teamIndex]);
        } else { spawnBurst(ball.x, ball.y, color(255, 230, 100)); }
    }
};

var checkCollisions = function() {
    resolveCollision(player1);
    resolveCollision(player2);
    var barY = 350 - goalHeight;
    if (abs(ball.y - barY) <= ball.radius) {
        if (ball.x <= goalWidth || ball.x >= canvasWidth - goalWidth) {
            ball.vy = -abs(ball.vy) * 0.8 - 1;
            ball.y = barY - ball.radius;
            spawnBurst(ball.x, ball.y, color(255));
        }
    }
};

var checkGoals = function() {
    if (ball.y > 350 - goalHeight) {
        if (ball.x < goalWidth) { score2++; spawnBurst(ball.x, ball.y, color(0, 150, 255)); initEntities(); }
        if (ball.x > canvasWidth - goalWidth) { score1++; spawnBurst(ball.x, ball.y, color(255, 50, 50)); initEntities(); }
    }
};

var processPeriodEnd = function() {
    if (inGroupStage) {
        if (currentPeriod === 1) {
            if (halftimeEnabled) { gameState = "HALFTIME"; breakStart = millis(); }
            else { currentPeriod = 2; timerStart = millis(); initEntities(); }
        } else if (currentPeriod === 2) {
            goToMatchEnd(false);
        }
        return;
    }
    if (currentPeriod === 1) {
        if (halftimeEnabled) { gameState = "HALFTIME"; breakStart = millis(); }
        else { currentPeriod = 2; timerStart = millis(); initEntities(); }
    } else if (currentPeriod === 2) {
        if (score1 === score2) { currentPeriod = 3; gameState = "OVERTIME"; timerStart = millis(); initEntities(); }
        else { goToMatchEnd(false); }
    } else if (currentPeriod === 3) {
        if (score1 === score2) { gameState = "PENALTIES"; setupPenaltyData(); }
        else { goToMatchEnd(false); }
    }
};

// --- Pause ---
var pauseGame = function() {
    if (paused) { return; }
    if (gameState !== "PLAYING" && gameState !== "OVERTIME" &&
        gameState !== "HALFTIME" && gameState !== "PENALTIES") { return; }
    paused = true; pauseStart = millis(); releaseJoystick();
};

var unpauseGame = function() {
    if (!paused) { return; }
    var delta = millis() - pauseStart;
    if (gameState === "PLAYING" || gameState === "OVERTIME") { timerStart += delta; }
    else if (gameState === "HALFTIME") { breakStart += delta; }
    else if (gameState === "PENALTIES" && penBallState === "KICKED") { penTimer += delta; }
    paused = false;
};

var copyMatches = function(arr) {
    var out = [];
    if (!arr) { return out; }
    for (var i = 0; i < arr.length; i++) {
        var m = arr[i];
        out.push({ t1: m.t1, t2: m.t2, s1: m.s1, s2: m.s2, winner: m.winner });
    }
    return out;
};

var copyGroups = function(src) {
    var out = [];
    for (var i = 0; i < src.length; i++) {
        var g = src[i];
        var res = [];
        for (var j = 0; j < g.results.length; j++) {
            res.push(g.results[j] ? { sa: g.results[j].sa, sb: g.results[j].sb } : null);
        }
        out.push({
            teams: g.teams.slice(0),
            results: res,
            standings: g.standings ? g.standings.slice(0) : null
        });
    }
    return out;
};

var captureSaveState = function() {
    return {
        gameMode: gameMode, gameState: gameState,
        score1: score1, score2: score2, currentPeriod: currentPeriod,
        elapsedMs: (gameState === "PLAYING" || gameState === "OVERTIME") ? (millis() - timerStart) : 0,
        selectedCountry: selectedCountry, aiCountry: aiCountry, tournamentRound: tournamentRound,
        bracket: {
            r0: copyMatches(bracket.r0), r1: copyMatches(bracket.r1),
            r2: copyMatches(bracket.r2), r3: copyMatches(bracket.r3),
            r4: copyMatches(bracket.r4)
        },
        groups: copyGroups(groups),
        playerGroupIdx: playerGroupIdx,
        playerMatchesPlayed: playerMatchesPlayed,
        inGroupStage: inGroupStage,
        penaltyTurn: penaltyTurn, penaltyIndex: penaltyIndex,
        p1PenScores: p1PenScores.slice(0), p2PenScores: p2PenScores.slice(0),
        penBallState: penBallState, penGoalieState: penGoalieState, penBallDir: penBallDir,
        player1: { x: player1.x, y: player1.y, vx: player1.vx, vy: player1.vy },
        player2: { x: player2.x, y: player2.y, vx: player2.vx, vy: player2.vy },
        ball: { x: ball.x, y: ball.y, vx: ball.vx, vy: ball.vy, angle: ball.angle, teamIndex: ball.teamIndex }
    };
};

var saveCurrentGame = function() { savedGame = captureSaveState(); saveGameToStorage(); };

var restoreSavedGame = function() {
    if (savedGame === null) { return; }
    var s = savedGame;
    gameMode = s.gameMode; gameState = s.gameState;
    score1 = s.score1; score2 = s.score2; currentPeriod = s.currentPeriod;
    selectedCountry = s.selectedCountry; aiCountry = s.aiCountry; tournamentRound = s.tournamentRound;
    if (s.bracket) {
        bracket.r0 = copyMatches(s.bracket.r0 || []);
        bracket.r1 = copyMatches(s.bracket.r1 || []);
        bracket.r2 = copyMatches(s.bracket.r2 || []);
        bracket.r3 = copyMatches(s.bracket.r3 || []);
        bracket.r4 = copyMatches(s.bracket.r4 || []);
    }
    if (s.groups) { groups = copyGroups(s.groups); }
    if (s.playerGroupIdx !== undefined) { playerGroupIdx = s.playerGroupIdx; }
    if (s.playerMatchesPlayed !== undefined) { playerMatchesPlayed = s.playerMatchesPlayed; }
    if (s.inGroupStage !== undefined) { inGroupStage = s.inGroupStage; }
    penaltyTurn = s.penaltyTurn; penaltyIndex = s.penaltyIndex;
    p1PenScores = s.p1PenScores.slice(0); p2PenScores = s.p2PenScores.slice(0);
    penBallState = s.penBallState; penGoalieState = s.penGoalieState; penBallDir = s.penBallDir;
    initEntities();
    if (s.player1) {
        player1.x = s.player1.x; player1.y = s.player1.y;
        player1.vx = s.player1.vx; player1.vy = s.player1.vy;
    }
    if (s.player2) {
        player2.x = s.player2.x; player2.y = s.player2.y;
        player2.vx = s.player2.vx; player2.vy = s.player2.vy;
    }
    if (s.ball) {
        ball.x = s.ball.x; ball.y = s.ball.y;
        ball.vx = s.ball.vx; ball.vy = s.ball.vy;
        ball.angle = s.ball.angle; ball.teamIndex = s.ball.teamIndex;
    }
    if (gameState === "PLAYING" || gameState === "OVERTIME") { timerStart = millis() - s.elapsedMs; }
    else if (gameState === "PENALTIES") { penTimer = millis(); }
    particles = []; paused = false; savedGame = null; saveGameToStorage();
};

    paused = false; particles = []; releaseJoystick(); gameState = "TITLE";

var drawBracketMatchNode = function(x, y, w, h, match) {
    fill(theme.card); stroke(theme.cardStroke); strokeWeight(1); rect(x, y, w, h, 2);
    if (!match) { return; }
    var halfH = h / 2;

    if (match.t1 !== null && match.t1 !== undefined) {
        drawFlag(match.t1, x + 2, y + 1, 12, 7);
        fill(match.winner === match.t1 ? theme.winText : theme.text);
        textSize(6); textAlign(LEFT, CENTER);
        var name1 = (match.t1 === selectedCountry) ? username : tournamentTeams[match.t1];
        if (name1.length > 9) { name1 = name1.substring(0, 8) + "."; }
        var s1 = (match.s1 !== null) ? " " + match.s1 : "";
        text(name1 + s1, x + 16, y + halfH * 0.5 + 0.5);
    }
    stroke(theme.cardStroke); line(x + 2, y + halfH, x + w - 2, y + halfH);
    if (match.t2 !== null && match.t2 !== undefined) {
        drawFlag(match.t2, x + 2, y + halfH + 1, 12, 7);
        fill(match.winner === match.t2 ? theme.winText : theme.text);
        textSize(6); textAlign(LEFT, CENTER);
        var name2 = (match.t2 === selectedCountry) ? username : tournamentTeams[match.t2];
        if (name2.length > 9) { name2 = name2.substring(0, 8) + "."; }
        var s2 = (match.s2 !== null) ? " " + match.s2 : "";
        text(name2 + s2, x + 16, y + halfH * 1.5 + 0.5);
    }
};

var drawBracketConnector = function(xFrom, yA, yB, xTo) {
    var xVert = xFrom + (xTo - xFrom) * 0.5;
    var yMid = (yA + yB) / 2;
    line(xFrom, yA, xVert, yA);
    line(xFrom, yB, xVert, yB);
    line(xVert, yA, xVert, yB);
    line(xVert, yMid, xTo, yMid);
};

var keyboardRowN = "1234567890";
var keyboardRow1 = "qwertyuiop";
var keyboardRow2 = "asdfghjkl";
var keyboardRow3 = "zxcvbnm";

var drawKeyCap = function(x, y, w, h, label, bgClr, fgClr) {
    if (bgClr === undefined) { bgClr = theme.keyCap; }
    if (fgClr === undefined) { fgClr = theme.keyCapText; }
    fill(bgClr); stroke(lightMode ? color(158, 176, 198) : color(255, 180)); strokeWeight(1);
    rect(x, y, w, h, 4);
    fill(fgClr); textAlign(CENTER, CENTER);
    textSize(label.length > 1 ? 8 : 13);
    text(label, x + w / 2, y + h / 2);
};

var drawKeyboard = function() {
    if (!keyboard.visible) { return; }
    fill(theme.keyboardPanel); noStroke(); rect(0, 235, canvasWidth, 165);
    fill(theme.gold); textAlign(CENTER, CENTER); textSize(10);
    var caseTag = keyboard.shift ? "  [ABC]" : "  [abc]";
    var header = "EDITING";
    if (keyboard.target === "USERNAME") { header = "EDITING USERNAME"; }
    else if (keyboard.target === "PASSWORD") { header = "EDITING PASSWORD"; }
    else if (keyboard.target === "P1NAME") { header = "PLAYER 1 WASD - ENTER NAME"; }
    else if (keyboard.target === "P2NAME") { header = "PLAYER 2 ARROWS - ENTER NAME"; }
    text(header + caseTag, 200, 240);

    var kw = keyboard.keyW, kh = keyboard.keyH;
    var gap = keyboard.gap, rowGap = keyboard.rowGap;
    var baseY = keyboard.baseY;
    var i, kx, label;

    for (i = 0; i < keyboardRowN.length; i++) {
        kx = 6 + i * (kw + gap);
        drawKeyCap(kx, baseY, kw, kh, keyboardRowN.charAt(i), theme.keyCapNum, theme.keyCapText);
    }
    stroke(theme.cardStroke); strokeWeight(1);
    line(20, baseY + kh + 1, 380, baseY + kh + 1);

    var r1y = baseY + kh + rowGap;
    for (i = 0; i < keyboardRow1.length; i++) {
        label = keyboardRow1.charAt(i);
        if (keyboard.shift) { label = toUpperCh(label); }
        kx = 6 + i * (kw + gap);
        drawKeyCap(kx, r1y, kw, kh, label);
    }
    var r2w = keyboardRow2.length * kw + (keyboardRow2.length - 1) * gap;
    var r2x = (canvasWidth - r2w) / 2;
    var r2y = r1y + kh + rowGap;
    for (i = 0; i < keyboardRow2.length; i++) {
        label = keyboardRow2.charAt(i);
        if (keyboard.shift) { label = toUpperCh(label); }
        kx = r2x + i * (kw + gap);
        drawKeyCap(kx, r2y, kw, kh, label);
    }
    var r3w = (keyboardRow3.length + 2) * kw + (keyboardRow3.length + 1) * gap;
    var r3x = (canvasWidth - r3w) / 2;
    var r3y = r2y + kh + rowGap;
    drawKeyCap(r3x, r3y, kw, kh, "SHIFT",
               keyboard.shift ? theme.keyShiftOn : theme.keyCapSpecial, theme.keyCapText);
    for (i = 0; i < keyboardRow3.length; i++) {
        label = keyboardRow3.charAt(i);
        if (keyboard.shift) { label = toUpperCh(label); }
        kx = r3x + (i + 1) * (kw + gap);
        drawKeyCap(kx, r3y, kw, kh, label);
    }
    var bsX = r3x + (keyboardRow3.length + 1) * (kw + gap);
    drawKeyCap(bsX, r3y, kw, kh, "DEL", theme.keyDel, color(255));

    var r4y = r3y + kh + rowGap;
    drawKeyCap(6, r4y, 260, kh, "SPACE", theme.keySpace, theme.keyCapText);
    drawKeyCap(272, r4y, 122, kh, "DONE", color(40, 140, 60), color(255));
};

var appendChar = function(ch) {
    var out = ch;
    if (keyboard.shift) { out = toUpperCh(ch); keyboard.shift = false; }
    else { out = toLowerCh(ch); }
    if (keyboard.target === "USERNAME") { if (username.length < 12) { username += out; } }
    else if (keyboard.target === "PASSWORD") { if (currentPassword.length < 20) { currentPassword += out; } }
    else if (keyboard.target === "P1NAME") { if (tempName1.length < 12) { tempName1 += out; } }
    else if (keyboard.target === "P2NAME") { if (tempName2.length < 12) { tempName2 += out; } }
};

var backspaceChar = function() {
    if (keyboard.target === "USERNAME") { if (username.length > 0) { username = username.substring(0, username.length - 1); } }
    else if (keyboard.target === "PASSWORD") { if (currentPassword.length > 0) { currentPassword = currentPassword.substring(0, currentPassword.length - 1); } }
    else if (keyboard.target === "P1NAME") { if (tempName1.length > 0) { tempName1 = tempName1.substring(0, tempName1.length - 1); } }
    else if (keyboard.target === "P2NAME") { if (tempName2.length > 0) { tempName2 = tempName2.substring(0, tempName2.length - 1); } }
};

var commitKeyboardInput = function() {
    if (keyboard.target === "PASSWORD") { if (currentPassword.length > 0) { checkPasswordMatch(currentPassword); } }
    else if (keyboard.target === "USERNAME") { if (username.trim().length === 0) { username = "Player"; } }
    else if (keyboard.target === "P1NAME") { if (tempName1.trim().length === 0) { tempName1 = "Player 1"; } gameState = "P1_COUNTRY"; }
    else if (keyboard.target === "P2NAME") { if (tempName2.trim().length === 0) { tempName2 = "Player 2"; } gameState = "P2_COUNTRY"; }
};

var closeKeyboard = function() {
    keyboard.visible = false; keyboard.target = "NONE"; keyboard.shift = false; activeInputMode = "NONE";
};

var openKeyboardFor = function(target) {
    keyboard.visible = true; keyboard.target = target; keyboard.shift = false; activeInputMode = target;
};

var handleKeyboardClick = function(mx, my) {
    if (!keyboard.visible) { return false; }
    var kw = keyboard.keyW, kh = keyboard.keyH, gap = keyboard.gap, rowGap = keyboard.rowGap;
    var baseY = keyboard.baseY;
    var i, kx;

    if (my >= baseY && my <= baseY + kh) {
        for (i = 0; i < keyboardRowN.length; i++) {
            kx = 6 + i * (kw + gap);
            if (mx >= kx && mx <= kx + kw) { appendChar(keyboardRowN.charAt(i)); return true; }
        }
        return true;
    }
    var r1y = baseY + kh + rowGap;
    if (my >= r1y && my <= r1y + kh) {
        for (i = 0; i < keyboardRow1.length; i++) {
            kx = 6 + i * (kw + gap);
            if (mx >= kx && mx <= kx + kw) { appendChar(keyboardRow1.charAt(i)); return true; }
        }
        return true;
    }
    var r2w = keyboardRow2.length * kw + (keyboardRow2.length - 1) * gap;
    var r2x = (canvasWidth - r2w) / 2;
    var r2y = r1y + kh + rowGap;
    if (my >= r2y && my <= r2y + kh) {
        for (i = 0; i < keyboardRow2.length; i++) {
            kx = r2x + i * (kw + gap);
            if (mx >= kx && mx <= kx + kw) { appendChar(keyboardRow2.charAt(i)); return true; }
        }
        return true;
    }
    var r3w = (keyboardRow3.length + 2) * kw + (keyboardRow3.length + 1) * gap;
    var r3x = (canvasWidth - r3w) / 2;
    var r3y = r2y + kh + rowGap;
    if (my >= r3y && my <= r3y + kh) {
        if (mx >= r3x && mx <= r3x + kw) { keyboard.shift = !keyboard.shift; return true; }
        for (i = 0; i < keyboardRow3.length; i++) {
            kx = r3x + (i + 1) * (kw + gap);
            if (mx >= kx && mx <= kx + kw) { appendChar(keyboardRow3.charAt(i)); return true; }
        }
        var bsX = r3x + (keyboardRow3.length + 1) * (kw + gap);
        if (mx >= bsX && mx <= bsX + kw) { backspaceChar(); return true; }
        return true;
    }
    var r4y = r3y + kh + rowGap;
    if (my >= r4y && my <= r4y + kh) {
        if (mx >= 6 && mx <= 266) { appendChar(" "); return true; }
        if (mx >= 272 && mx <= 394) { commitKeyboardInput(); closeKeyboard(); return true; }
        return true;
    }
    return false;
};

var runGameLoop = function() {
    if (!paused) {
        var periodMax = (currentPeriod === 3) ? extraTimeDuration : periodDuration;
        if (floor((millis() - timerStart) / 1000) >= periodMax) { processPeriodEnd(); return; }
        var p1Ctrl = "P1_INPUT";
        var p2Ctrl = (gameMode === "SINGLE") ? "AI" : "P2_INPUT";
        updatePlayer(player1, p1Ctrl);
        updatePlayer(player2, p2Ctrl);
        updateBall();
        checkCollisions();
        checkGoals();
    }
    drawPitch();
    drawPlayer(player1);
    drawPlayer(player2);
    drawBall();
    updateAndDrawParticles();
    drawGameplayHUD();
    drawMobileControls();
    drawPauseButton();
    if (paused) { drawPauseMenu(); }
};

var runHalftimeLoop = function() {
    if (!paused) {
        var elapsed = floor((millis() - breakStart) / 1000);
        var remaining = breakDuration - elapsed;
        if (remaining <= 0) {
            currentPeriod = 2; timerStart = millis(); initEntities(); gameState = "PLAYING";
            return;
        }
    }
    drawPitch();
    drawPlayer(player1);
    drawPlayer(player2);
    fill(theme.overlay); rect(0, 0, canvasWidth, canvasHeight);
    var elapsed2 = floor((millis() - breakStart) / 1000);
    var remaining2 = breakDuration - elapsed2;
    fill(theme.text); textAlign(CENTER, CENTER); textSize(22);
    text("HALF TIME", 200, 150);
    fill(theme.gold); textSize(14);
    text("Resuming 2nd Half in: " + max(0, remaining2) + "s", 200, 190);
    drawPauseButton();
    if (paused) { drawPauseMenu(); }
};

    for (var gj = gy; gj <= gy + gh; gj += 8) { line(gx, gj, gx + gw, gj); }
    stroke(0, 0, 0, 160); strokeWeight(8); noFill();

    drawMobilePenaltyArrows();
    drawPauseButton();
    if (paused) { drawPauseMenu(); }
};

var keyPressed = function() {
    keys[keyCode] = true;
    if (keyCode === 16) { shiftDown = true; }
    if (keyCode === 80) { if (paused) { unpauseGame(); } else { pauseGame(); } return; }
    if (paused) { return; }

    if (gameState === "SETTINGS" || gameState === "P1_NAME" || gameState === "P2_NAME") {
        var target = activeInputMode;
        if (target === "USERNAME") {
            if (keyCode === 8) { if (username.length > 0) { username = username.substring(0, username.length - 1); } }
            else if (keyCode === 10 || keyCode === 13) { if (username.trim().length === 0) { username = "Player"; } closeKeyboard(); }
            else if (keyCode !== 16) { var ch = resolveTypedChar(); if (ch !== "" && username.length < 12) { username += ch; } }
        } else if (target === "PASSWORD") {
            if (keyCode === 8) { if (currentPassword.length > 0) { currentPassword = currentPassword.substring(0, currentPassword.length - 1); } }
            else if (keyCode === 10 || keyCode === 13) { if (!keyboard.visible) { checkPasswordMatch(currentPassword); } closeKeyboard(); }
            else if (keyCode !== 16) { var ch2 = resolveTypedChar(); if (ch2 !== "" && currentPassword.length < 20) { currentPassword += ch2; } }
        } else if (target === "P1NAME") {
            if (keyCode === 8) { if (tempName1.length > 0) { tempName1 = tempName1.substring(0, tempName1.length - 1); } }
            else if (keyCode === 10 || keyCode === 13) { if (tempName1.trim().length === 0) { tempName1 = "Player 1"; } closeKeyboard(); gameState = "P1_COUNTRY"; }
            else if (keyCode !== 16) { var ch3 = resolveTypedChar(); if (ch3 !== "" && tempName1.length < 12) { tempName1 += ch3; } }
        } else if (target === "P2NAME") {
            if (keyCode === 8) { if (tempName2.length > 0) { tempName2 = tempName2.substring(0, tempName2.length - 1); } }
            else if (keyCode === 10 || keyCode === 13) { if (tempName2.trim().length === 0) { tempName2 = "Player 2"; } closeKeyboard(); gameState = "P2_COUNTRY"; }
            else if (keyCode !== 16) { var ch4 = resolveTypedChar(); if (ch4 !== "" && tempName2.length < 12) { tempName2 += ch4; } }
        }
    }

    if (gameState === "MATCH_END") {
        if (keyCode === 10 || keyCode === 13 || keyCode === 32) {
            continueAfterMatch();
        }
    }

    if (gameState === "PENALTIES") {
        if (keyCode === LEFT || keyCode === 37) { triggerPenaltyShot("LEFT"); }
        if (keyCode === RIGHT || keyCode === 39) { triggerPenaltyShot("RIGHT"); }
    }
};

var keyReleased = function() {
    keys[keyCode] = false;
    if (keyCode === 16) { shiftDown = false; }
};

var handleGridClick = function(onSelectCallback) {
    for (var i = 0; i < tournamentTeams.length; i++) {
        var r = getCountryCellRect(i);
        if (mouseX > r.x && mouseX < r.x + r.w && mouseY > r.y && mouseY < r.y + r.h) {
            onSelectCallback(i);
            break;
        }
    }
};

var mousePressed = function() {
    if (paused) { handlePauseMenuClick(mouseX, mouseY); return; }
    if (gameState === "P1_NAME" || gameState === "P2_NAME") { handleKeyboardClick(mouseX, mouseY); return; }

    if (gameState === "PLAYING" || gameState === "OVERTIME" ||
        gameState === "HALFTIME" || gameState === "PENALTIES") {
        if (pointOnPauseButton(mouseX, mouseY)) { pauseGame(); return; }
    }

    if (gameState === "PENALTIES" && mobileControlsEnabled) {
        if (mouseX > 20 && mouseX < 120 && mouseY > 330 && mouseY < 390) { triggerPenaltyShot("LEFT"); return; }
        if (mouseX > 280 && mouseX < 380 && mouseY > 330 && mouseY < 390) { triggerPenaltyShot("RIGHT"); return; }
    }

    if (gameState === "PLAYING" || gameState === "OVERTIME") {
        if (mobileControlsEnabled) { handleJoystickPress(mouseX, mouseY); }
        return;
    }

    if (gameState === "MATCH_END") {
        if (mouseX > 110 && mouseX < 290 && mouseY > 335 && mouseY < 377) {
            continueAfterMatch();
        }
        return;
    }

    if (gameState === "TITLE") {
        var btns = getTitleButtonLayout();
        for (var i = 0; i < btns.length; i++) {
            var b = btns[i];
            if (mouseX > 110 && mouseX < 290 && mouseY > b.y && mouseY < b.y + b.h) {
                if (b.id === "continue") { restoreSavedGame(); }
                else if (b.id === "single") { gameMode = "SINGLE"; gameState = "TOURNAMENT_SELECT"; }
                else if (b.id === "local") {
                    if (!mobileControlsEnabled) {
                        gameMode = "LOCAL";
                        tempName1 = "Player 1"; tempName2 = "Player 2"; p2Country = 1;
                        gameState = "P1_NAME"; openKeyboardFor("P1NAME");
                    }
                } else if (b.id === "penalty") { gameMode = "PENALTY_ONLY"; gameState = "PENALTY_P1_SELECT"; }
                else if (b.id === "settings") { gameState = "SETTINGS"; }
                return;
            }
        }
    } else if (gameState === "SETTINGS") {
        if (mouseX > 325 && mouseX < 349 && mouseY > 67 && mouseY < 91) { passwordVisible = !passwordVisible; return; }
        if (keyboard.visible) {
            if (handleKeyboardClick(mouseX, mouseY)) { return; }
            if (mouseX > 40 && mouseX < 360 && mouseY > 36 && mouseY < 62) { openKeyboardFor("USERNAME"); return; }
            if (mouseX > 40 && mouseX < 360 && mouseY > 66 && mouseY < 92) { openKeyboardFor("PASSWORD"); return; }
            closeKeyboard(); return;
        }
        if (mouseX > 40 && mouseX < 360) {
            if (mouseY > 36 && mouseY < 62) { if (mobileControlsEnabled) { openKeyboardFor("USERNAME"); } else { activeInputMode = "USERNAME"; } }
            else if (mouseY > 66 && mouseY < 92) { if (mobileControlsEnabled) { openKeyboardFor("PASSWORD"); } else { activeInputMode = "PASSWORD"; } }
        }
        if (mouseY > 96 && mouseY < 122) {
            if (mouseX > 40 && mouseX < 140) { halftimeEnabled = !halftimeEnabled; saveSettings(); }
            else if (mouseX > 150 && mouseX < 250) { p1ControlMode = (p1ControlMode === "ARROWS") ? "WASD" : "ARROWS"; saveSettings(); }
            else if (mouseX > 260 && mouseX < 360) {
                mobileControlsEnabled = !mobileControlsEnabled;
                if (!mobileControlsEnabled) { closeKeyboard(); }
                saveSettings();
            }
        }
        if (mouseY > 126 && mouseY < 152) {
            if (mouseX > 40 && mouseX < 360) { retroMode = !retroMode; saveSettings(); }
        }
        if (mouseY > 156 && mouseY < 182) {
            if (mouseX > 40 && mouseX < 360) {
                lightMode = !lightMode;
                applyTheme();
                saveSettings();
            }
        }
        if (mouseX > 110 && mouseX < 290 && mouseY > 348 && mouseY < 380) {
            if (username.trim().length === 0) { username = "Player"; }
            closeKeyboard(); gameState = "TITLE";
        }
    } else if (gameState === "TOURNAMENT_SELECT") {
        handleGridClick(function(idx) {
            selectedCountry = idx;
            savedGame = null; saveGameToStorage();
            if (gameMode === "SINGLE") { gameState = "DIFFICULTY_SELECT"; }
            else { gameState = "BRACKET"; }
        });
    } else if (gameState === "P1_COUNTRY") {
        handleGridClick(function(idx) { selectedCountry = idx; gameState = "P2_NAME"; openKeyboardFor("P2NAME"); });
    } else if (gameState === "P2_COUNTRY") {
        handleGridClick(function(idx) { p2Country = idx; gameState = "MATCH_START"; });
    } else if (gameState === "PENALTY_P1_SELECT") {
        handleGridClick(function(idx) {
            selectedCountry = idx;
            do { aiCountry = floor(random(0, 48)); } while (aiCountry === selectedCountry);
            savedGame = null; saveGameToStorage(); gameState = "PENALTIES"; setupPenaltyData();
        });
    } else if (gameState === "DIFFICULTY_SELECT") {
        if (mouseX > 110 && mouseX < 290) {
            if (mouseY > 100 && mouseY < 138) { difficulty = "EASY"; saveSettings(); }
            else if (mouseY > 150 && mouseY < 188) { difficulty = "MEDIUM"; saveSettings(); }
            else if (mouseY > 200 && mouseY < 238) { difficulty = "HARD"; saveSettings(); }
            else if (mouseY > 280 && mouseY < 315) {
                buildGroups();
                aiCountry = getPlayerOpponent(0);
                gameState = "MATCH_START";
            }
        }
    } else if (gameState === "GROUPS") {
        if (mouseX > 110 && mouseX < 290 && mouseY > 265 && mouseY < 303) {
            if (playerMatchesPlayed < 3) {
                aiCountry = getPlayerOpponent(playerMatchesPlayed);
                gameState = "MATCH_START";
            } else {
                var qualified = determineQualifiers();
                fillBracketFromQualifiers(qualified);
                inGroupStage = false;
                gameState = "BRACKET";
            }
        } else if (mouseX > 110 && mouseX < 290 && mouseY > 278 && mouseY < 316) {
            if (playerMatchesPlayed >= 3) {
                var qualified2 = determineQualifiers();
                fillBracketFromQualifiers(qualified2);
                inGroupStage = false;
                gameState = "BRACKET";
            }
        }
    } else if (gameState === "BRACKET") {
        var wonTournament = (bracket.r4[0] && bracket.r4[0].winner === selectedCountry);
        var eliminated = isPlayerEliminated();
        if (wonTournament) {
            if (mouseX > 110 && mouseX < 290 && mouseY > 358 && mouseY < 388) { gameState = "TITLE"; }
        } else if (eliminated) {
            if (isPlayerInBracket() && tournamentRound <= 5) {
                if (mouseX > 40 && mouseX < 190 && mouseY > 358 && mouseY < 388) { simulateCurrentRound(); }
                if (mouseX > 210 && mouseX < 360 && mouseY > 358 && mouseY < 388) { gameState = "TITLE"; }
            } else {
                if (mouseX > 110 && mouseX < 290 && mouseY > 358 && mouseY < 388) { gameState = "TITLE"; }
            }
        } else {
            if (mouseX > 110 && mouseX < 290 && mouseY > 358 && mouseY < 388) {
                setNextAiOpponent(); gameState = "MATCH_START";
            }
        }
    } else if (gameState === "MATCH_START") {
        if (mouseX > 110 && mouseX < 290 && mouseY > 260 && mouseY < 300) {
            score1 = 0; score2 = 0; currentPeriod = 1;
            initEntities(); timerStart = millis();
            gameState = "PLAYING";
        }
    }
};

// Helper: since the group screen uses different y than bracket, this matches
// the "CONTINUE TO KNOCKOUTS" button row when the player qualified.
var fillBracketFromQualifiers = function(qualified) {
    fillKnockoutBracket(qualified);
};

var mouseReleased = function() { releaseJoystick(); };
var mouseDragged = function() { if (!paused && mobileControlsEnabled && joystick.active) { updateJoystick(mouseX, mouseY); } };

// ============================================================
// MAIN DRAW LOOP
// ============================================================
var draw = function() {
    background(theme.bg);
    if (teamColors.length === 0) {
        initColors();
        loadActiveSession();
        loadAccountData();
        loadGameFromStorage();
    }

    updateFPS();

    if (gameState === "TITLE") { drawTitleScreen(); }
    else if (gameState === "SETTINGS") { drawSettingsScreen(); }
    else if (gameState === "DIFFICULTY_SELECT") { drawDifficultyScreen(); }
    else if (gameState === "MATCH_START") { drawMatchStartNotification(); }
    else if (gameState === "GROUPS") { drawGroupsScreen(); }
    else if (gameState === "BRACKET") { drawBracketScreen(); }
    else if (gameState === "TOURNAMENT_SELECT") {
        drawPitch(); fill(theme.overlay); rect(0, 0, canvasWidth, canvasHeight);
        fill(theme.text); textAlign(CENTER, CENTER); textSize(13);
        text("SELECT YOUR NATION", 200, 15);
        drawCountryGrid(selectedCountry);
    }
    else if (gameState === "PENALTY_P1_SELECT") {
        drawPitch(); fill(theme.overlay); rect(0, 0, canvasWidth, canvasHeight);
        fill(theme.text); textAlign(CENTER, CENTER); textSize(13);
        text("SHOOTOUT: SELECT YOUR NATION", 200, 15);
        drawCountryGrid(selectedCountry);
    }
    else if (gameState === "P1_NAME") { drawNameEntryScreen("P1NAME"); }
    else if (gameState === "P2_NAME") { drawNameEntryScreen("P2NAME"); }
    else if (gameState === "P1_COUNTRY") { drawCountryPickScreen("P1_COUNTRY"); }
    else if (gameState === "P2_COUNTRY") { drawCountryPickScreen("P2_COUNTRY"); }
    else if (gameState === "MATCH_END") { drawMatchEndScreen(); }
    else if (gameState === "PLAYING") { runGameLoop(); }
    else if (gameState === "HALFTIME") { runHalftimeLoop(); }
    else if (gameState === "OVERTIME") { runGameLoop(); }
    else if (gameState === "PENALTIES") { runPenaltyLoop(); }

    drawFPS();
};

// ============================================================
// p5.js bootstrap + iOS touch
// ============================================================
function setup() {
    var c = createCanvas(canvasWidth, canvasHeight);
    pixelDensity(1);
    c.parent(document.body);
    loadSettings();
}

function touchStarted() { if (typeof mousePressed === "function") { mousePressed(); } return false; }
function touchEnded() { if (typeof mouseReleased === "function") { mouseReleased(); } return false; }

</script>
</body>
